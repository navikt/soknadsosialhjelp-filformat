name: 'Build Code'

on:
  push:
    branches:
      - '**' # Build all branches

jobs:
  build:
    runs-on: ubuntu-latest
    # Build-only job: it compiles and runs tests, it does not publish anything.
    # Releasing is done by releaseGithub.yml, which requests packages: write itself.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - name: Build with Gradle
        run: ./gradlew clean build
